services:
  mysql:
    image: mysql:8.4
    container_name: dealplus-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_change_me}
      MYSQL_USER: ${MYSQL_USER:-dealplus}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-approval_db}
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infrastructure/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-local_root_change_me}"]
      interval: 10s
      timeout: 5s
      retries: 10
  rabbitmq:
    image: rabbitmq:3-management
    container_name: dealplus-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-dealplus}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-local_change_me}
    ports: ["5672:5672", "15672:15672"]
  redis:
    image: redis:7-alpine
    container_name: dealplus-redis
    restart: unless-stopped
    ports: ["6379:6379"]
  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: dealplus-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dealplus}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local_change_me_123}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
volumes:
  mysql_data:
  minio_data:
